services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-order_processing}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ${WORKING_DIR:-./temp}/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ${WORKING_DIR:-./temp}/qdrant_data:/qdrant/storage
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ${WORKING_DIR:-./temp}/redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  order-bootstrap:
    build: .
    container_name: ai_powered_order_assistant_bootstrap
    command: >
      sh -c "python -m app.workers.order_bootstrap_worker"
    env_file:
      - .env
    environment:
      - WORKING_DIR=/workdir
      - PYTHONWARNINGS=ignore
    volumes:
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: "no"

  app:
    build: .
    container_name: ai_powered_order_assistant_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WORKING_DIR=/workdir
      - PYTHONWARNINGS=ignore
    volumes:
      - ${WORKING_DIR:-./temp}:/workdir
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    container_name: ai_powered_order_assistant_streamlit
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://app:8000/ai_powered_order_assistant/api/v1
    depends_on:
      - app
